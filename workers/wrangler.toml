name = "web-agent"
main = "src/index.ts"
compatibility_date = "2026-10-23"

# Job state: active-job pointer + short follow-up history per chat.
[[kv_namespaces]]
binding = "JOBS"
id = "f88fa722eb6a492b986ac67fd4eafa0f"

# One workflow instance per browsing job; each browse loop iteration runs as its
# own step (fresh 10ms CPU + 50 subrequest budget, unlimited wall clock on I/O).
[[workflows]]
name = "web-agent-workflow"
binding = "WEB_AGENT_WORKFLOW"
class_name = "WebAgentWorkflow"

[vars]
ADMIN_TELEGRAM_ID = "8653341779"
