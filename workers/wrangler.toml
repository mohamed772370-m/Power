name = "web-agent"
main = "src/index.ts"
compatibility_date = "2026-10-23"

# Job state: active-job pointer + short follow-up history per chat.
[[kv_namespaces]]
binding = "JOBS"
id = "f88fa722eb6a492b986ac67fd4eafa0f"

# One queue message chain per browsing job: each delivery is a fresh invocation
# with a fresh 50-subrequest budget. Consumer runs up to 4 units, re-enqueues.
[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "web-agent-jobs"

[[queues.consumers]]
queue = "web-agent-jobs"
max_batch_size = 1
max_retries = 3
max_concurrency = 1
dead_letter_queue = "web-agent-jobs-dlq"

[[queues.consumers]]
queue = "web-agent-jobs-dlq"
max_batch_size = 1
max_retries = 3
max_concurrency = 1

[vars]
ADMIN_TELEGRAM_ID = "8653341779"
